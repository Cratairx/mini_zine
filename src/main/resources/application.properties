spring.application.name=mini-zine
server.port=8080

# Phones send big photos; the page shrinks them before upload, but allow some headroom.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Where uploaded images are stored (one folder per zine).
minizine.data-dir=zine-data
