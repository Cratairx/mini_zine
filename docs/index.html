<!doctype html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mini Zine</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
    <h1>Min Mini Zine</h1>
    <div class="actions">
        <button type="button" id="printBtn">🖨️ Skriv ut</button>
        <button type="button" id="newBtn">✨ Ny zine</button>
    </div>
</header>

<main>
    <p class="hint">Tryck på en ruta för att lägga till en bild. Tryck på en bild för att rotera eller byta den. Bilderna sparas bara på den här enheten.</p>
    <p class="tip">📱 <strong>Tips:</strong> Håll iPaden upprätt när du fotar, då fyller bilden hela sidan!</p>

    <!-- One A4 sheet in landscape: 4 columns x 2 rows, same order as the paper template. -->
    <div class="sheet" id="sheet">
        <div class="panel top" data-slot="page-6" data-label="Sida 6"></div>
        <div class="panel top" data-slot="page-5" data-label="Sida 5"></div>
        <div class="panel top" data-slot="page-4" data-label="Sida 4"></div>
        <div class="panel top" data-slot="page-3" data-label="Sida 3"></div>
        <div class="panel" data-slot="back-cover" data-label="Baksida"></div>
        <div class="panel" data-slot="front-cover" data-label="Framsida"></div>
        <div class="panel" data-slot="page-1" data-label="Sida 1"></div>
        <div class="panel" data-slot="page-2" data-label="Sida 2"></div>
    </div>

    <label class="option">
        <input type="checkbox" id="flipTop" checked>
        Vänd översta raden upp och ner vid utskrift (behövs för att kunna vika zinen)
    </label>
</main>

<div class="toolbar" id="toolbar" hidden>
    <span class="toolbar-label" id="toolbarLabel"></span>
    <button type="button" data-action="rotate-left" aria-label="Rotera vänster">↺</button>
    <button type="button" data-action="rotate-right" aria-label="Rotera höger">↻</button>
    <button type="button" data-action="replace">📷 Byt bild</button>
    <button type="button" data-action="remove" class="danger">🗑️ Ta bort</button>
    <button type="button" data-action="close" aria-label="Stäng">✕</button>
</div>

<div class="toast" id="toast" hidden></div>

<input type="file" id="fileInput" accept="image/*" hidden>
<script src="app.js"></script>
</body>
</html>
